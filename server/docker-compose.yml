# Produktionsbetrieb: Node-Server hinter Caddy (automatisches HTTPS – iOS verlangt TLS).
# Start: cp .env.example .env && (Werte eintragen) && docker compose up -d
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt in .env}
      TRUST_PROXY: "true"
    volumes:
      - api-data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api

volumes:
  api-data:
  caddy-data:
