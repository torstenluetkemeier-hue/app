# Xcode-Projekt wird mit XcodeGen erzeugt:  brew install xcodegen && xcodegen generate
name: Wochenleicht
options:
  bundleIdPrefix: de.wochenleicht
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de

packages:
  WochenleichtCore:
    path: WochenleichtCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Wochenleicht:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: WochenleichtCore
      - sdk: Charts.framework
      - sdk: MapKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wochenleicht.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        # Eigenes Apple-Developer-Team hier eintragen (oder in Xcode unter "Signing & Capabilities" wählen)
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          # Lokaler Server (Simulator). Für ein echtes Gerät die IP des Rechners eintragen.
          API_BASE_URL: "http://localhost:8080"
        Release:
          API_BASE_URL: "https://api.example.de"

  WochenleichtCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WochenleichtCore/Tests/WochenleichtCoreTests
    dependencies:
      - package: WochenleichtCore

schemes:
  Wochenleicht:
    build:
      targets:
        Wochenleicht: all
    test:
      targets:
        - WochenleichtCoreTests
