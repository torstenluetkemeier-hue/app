# Cloud-Anrufbeantworter: Server + KI-Stimmdienst (nur für den Namen des Anrufers).
# Betrieb in einem deutschen Rechenzentrum; davor ein Reverse-Proxy mit TLS (z. B. Caddy).
services:
  anrufbeantworter:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # nur über den Reverse-Proxy erreichbar
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL setzen, z. B. https://ab.example.de}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN setzen}
      STIMME_URL: http://stimme:5000
    volumes:
      - daten:/data
    depends_on:
      - stimme

  # Chatterbox (Stimme aus den eigenen Aufnahmen) + Whisper (Gegenprüfung). Braucht eine NVIDIA-GPU,
  # sonst dauert ein Satz ~30 s – dann kommt beim ersten Anruf die Aufnahme "Guten Tag!".
  stimme:
    build: ./stimme
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # kein Port nach außen

volumes:
  daten:
